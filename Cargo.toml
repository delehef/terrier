[package]
name = "terrier"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
async-lsp = "0.2.2"
async-process = "2.3.1"
clap = { version = "4.5.40", features = ["derive", "env"] }
colored = "3.0.0"
dialoguer = { version = "0.11.0", features = ["fuzzy-select"] }
fern = { version = "0.7.1", features = ["colored"] }
log = "0.4.27"
oneshot = "0.1.11"
regex-lite = "0.1.6"
serde_json = "1.0.140"
spinoff = "0.8.0"
syn = { version = "2.0.104", features = ["parsing", "full", "extra-traits"] }
tokio = {version = "1.46.0", features = ["io-std", "io-util", "macros", "process", "rt", "time"]}
tower = "0.5.2"
